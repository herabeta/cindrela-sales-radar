<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cindrela Event Explorer</title><style>:root{--n:#101828;--bg:#f4f7fb;--card:#fff;--line:#e4e7ec;--mut:#667085;--blue:#2563eb;--red:#e5484d;--orange:#f79009}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:#172033}header{background:var(--n);color:#fff;padding:16px 28px;font-weight:900;font-size:20px}.wrap{max-width:1300px;margin:auto;padding:24px 22px 50px}.hero{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}.hero h1{margin:0 0 6px;font-size:30px}.hero p{margin:0;color:var(--mut)}.toolbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.toolbar select,.toolbar input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:700}.summary{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.pill{background:#fff;border:1px solid var(--line);padding:9px 12px;border-radius:9px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:#fff;border:1px solid var(--line);border-left:5px solid var(--orange);border-radius:13px;padding:16px}.top{display:flex;justify-content:space-between;gap:8px}.badge{font-size:10px;font-weight:900;background:#f2f4f7;padding:5px 8px;border-radius:20px}.score{font-size:11px;font-weight:900;color:#175cd3;background:#eef4ff;padding:5px 8px;border-radius:20px}.card h3{margin:11px 0 7px;font-size:17px}.meta{font-size:12.5px;color:var(--mut);line-height:1.7}.box{margin-top:10px;background:#f8fafc;border-radius:9px;padding:10px;font-size:12px}.box b{display:block;margin-bottom:4px}.source{display:inline-block;margin-top:11px;color:var(--blue);font-size:12px;font-weight:800;text-decoration:none}.empty{background:#fff;border:1px solid var(--line);border-radius:13px;padding:22px;color:var(--mut)}@media(max-width:900px){.toolbar{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr 1fr}}@media(max-width:600px){.toolbar{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.wrap{padding:16px 12px}}</style></head><body><header>CINDRELA SALES RADAR • EVENT EXPLORER</header><main class="wrap"><section class="hero"><h1>🌍 Upcoming Event Explorer</h1><p>Filter upcoming sales opportunities by country, city and month. Dates are kept separate from Daily Intelligence.</p></section><div class="toolbar"><select id="country"><option value="all">All countries</option><option>Nigeria</option><option>Senegal</option><option>Kenya</option><option>Tanzania</option><option>Uganda</option></select><select id="city"><option value="all">All cities</option><option>Abuja</option><option>Lagos</option><option>Dakar</option><option>Nairobi</option><option>Dar es Salaam</option><option>Kampala</option></select><select id="month"><option value="all">All upcoming months</option><option value="2026-09">September 2026</option><option value="2026-10">October 2026</option><option value="2026-11">November 2026</option><option value="2026-12">December 2026</option><option value="2027-01">January 2027</option><option value="2027-02">February 2027</option><option value="2027-03">March 2027</option></select><input id="q" placeholder="Search event / category / target..."></div><div class="summary"><span class="pill" id="count">0 events</span><span class="pill">📅 Upcoming calendar</span><span class="pill">🎯 Sales-relevant opportunities</span></div><section id="cards" class="cards"></section></main><script>const events=[

const $=id=>document.getElementById(id);function render(){const c=$('country').value,city=$('city').value,m=$('month').value,q=$('q').value.toLowerCase().trim();const list=events.filter(e=>(c==='all'||e.country===c)&&(city==='all'||e.city===city)&&(m==='all'||e.month===m)&&(!q||(`${e.name} ${e.category} ${e.target} ${e.sell} ${e.place}`).toLowerCase().includes(q))).sort((a,b)=>b.score-a.score);$('count').textContent=`${list.length} event${list.length===1?'':'s'}`;$('cards').innerHTML=list.length?list.map(e=>`<article class="card"><div class="top"><span class="badge">${e.category}</span><span class="score">${e.score}/100</span></div><h3>${e.name}</h3><div class="meta">📅 ${e.date}<br>📍 ${e.place}, ${e.country}<br>🎯 ${e.target}</div><div class="box"><b>💰 Cindrela can sell</b>${e.sell}</div><a class="source" href="${e.url}" target="_blank" rel="noopener">🔗 Verify source →</a></article>`).join(''):'<div class="empty">No matching upcoming event in the selected country/city/month.</div>'}['country','city','month','q'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',render));render();</script></body></html>
