<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cindrela Event Lead Finder</title><style>body{font-family:Inter,Arial,sans-serif;margin:0;background:#f4f7fb;color:#172033}.head{background:#101828;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;gap:12px}.wrap{max-width:1100px;margin:auto;padding:22px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar select,.toolbar input{padding:11px;border:1px solid #e4e7ec;border-radius:9px;background:#fff}.toolbar input{flex:1;min-width:240px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:16px;margin-top:14px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.chip{background:#eef2f6;border-radius:20px;padding:6px 9px;font-size:12px;font-weight:700}.cta{display:inline-block;background:#101828;color:#fff;padding:10px 13px;border-radius:9px;text-decoration:none;font-weight:800;margin-top:8px}.muted{color:#667085;font-size:12px}.score{font-weight:800;margin-top:12px}</style></head><body><header class="head"><b>CINDRELA SALES RADAR • EVENT LEAD FINDER</b><span>🇳🇬 Abuja</span></header><main class="wrap"><h1>Event → Target Lead Play</h1><p class="muted">Choose an event to see target roles, products and transparent scoring guidance.</p><div class="toolbar"><select id="event"></select><input id="role" placeholder="Filter target role..."><a class="cta" href="/">← Sales Radar</a><a class="cta" href="/sales-pipeline.html">📈 Pipeline</a></div><div id="result"></div></main><script>const fallback={"GITEX Nigeria 2026":{roles:["Exhibitor","Founder","CEO / Managing Director","Delegate / Attendee"],products:["Flight","Hotel","Airport Transfer","Business Travel"]},"21st Abuja International Trade Fair":{roles:["Exhibitor","Business Development","Operations","Delegate / Attendee"],products:["Corporate Travel","Hotel","Transfers","Group Booking"]},"International Cybersecurity Conference":{roles:["Founder","CEO / Managing Director","Operations","Delegate / Attendee"],products:["Flight","Hotel","Transfers","Corporate Travel"]},"Digital Nigeria International Conference":{roles:["Founder","CEO / Managing Director","Business Development","Delegate / Attendee"],products:["Flight","Hotel","Transfers","Business Travel"]},"Trade Expo Nigeria":{roles:["Exhibitor","Business Development","Operations","Delegate / Attendee"],products:["Corporate Travel","Hotel","Transfers","Group Booking"]},"Africa Space Economy Conference":{roles:["Founder","CEO / Managing Director","Operations","Delegate / Attendee"],products:["Flight","Hotel","Transfers","Executive Travel"]}};async function load(){let d=fallback;try{const r=await fetch('/data/leadfinder-event-config.json');const j=await r.json();if(j.events)d=j.events}catch(e){}window.data=d;event.innerHTML=Object.keys(d).map(x=>'<option>'+x+'</option>').join('');render()}function render(){const name=event.value,d=data[name]||fallback[name],q=role.value.toLowerCase();const roles=d.roles.filter(x=>!q||x.toLowerCase().includes(q));result.innerHTML='<section class="card"><h2>'+name+'</h2><p class="muted">Recommended target roles</p><div class="chips">'+roles.map(x=>'<span class="chip">🎯 '+x+'</span>').join('')+'</div><p class="muted">Recommended Cindrela products</p><div class="chips">'+d.products.map(x=>'<span class="chip">💰 '+x+'</span>').join('')+'</div><p class="score">Scoring: verified public contact +30 · exhibitor/sponsor +25 · executive +20 · event ≤14 days +20 · corporate need +15 · unverified −30</p><a class="cta" href="/lead-finder.html">Open Lead Finder →</a> <a class="cta" href="/sales-pipeline.html">Move prospects to Pipeline →</a></section>'}event.addEventListener('change',render);role.addEventListener('input',render);load()</script></body></html>
