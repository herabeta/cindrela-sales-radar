<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cindrela Sales Summary</title><style>body{font-family:Inter,Arial,sans-serif;margin:0;background:#f4f7fb;color:#172033}.header{background:#101828;color:#fff;padding:16px 24px;display:flex;justify-content:space-between}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer;background:#101828;color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.stat{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:16px}.stat b{display:block;font-size:25px}.muted{color:#667085;font-size:12px}.panel{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:18px;margin-top:16px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #e4e7ec;font-size:13px}input{padding:9px;border:1px solid #e4e7ec;border-radius:8px;width:180px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}table{font-size:11px}}</style></head><body><header class="header"><b>CINDRELA SALES RADAR • SALES SUMMARY</b><span>🇳🇬 Abuja</span></header><main class="wrap"><div class="top"><div><h1>Sales Summary</h1><p class="muted">Quick view of pipeline performance and deal values.</p></div><button class="btn" onclick="location.href='sales-pipeline.html'">← Back to Pipeline</button></div><div class="stats" id="stats"></div><div class="panel"><b>Deal Value Tracker</b><p class="muted">Add a quote/deal value to any lead. Lead Finder, Pipeline and Summary share the same browser database.</p><table><thead><tr><th>Company</th><th>Event</th><th>Stage</th><th>Priority</th><th>Deal / Quote Value (₦)</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const KEY='cindrela_sales_leads_v3';const stages=['New','Contacted','Interested','Quoted','Won','Lost'];let leads=JSON.parse(localStorage.getItem(KEY)||'[]');function money(n){return new Intl.NumberFormat('en-NG',{style:'currency',currency:'NGN',maximumFractionDigits:0}).format(Number(n)||0)}function save(){localStorage.setItem(KEY,JSON.stringify(leads))}function render(){leads=JSON.parse(localStorage.getItem(KEY)||'[]');const won=leads.filter(x=>x.status==='Won'),active=leads.filter(x=>!['Won','Lost'].includes(x.status));const wonVal=won.reduce((s,x)=>s+Number(x.dealValue||0),0),pipeVal=leads.filter(x=>x.status!=='Lost').reduce((s,x)=>s+Number(x.dealValue||0),0);document.getElementById('stats').innerHTML='<div class="stat"><b>'+leads.length+'</b><span class="muted">Total Leads</span></div><div class="stat"><b>'+active.length+'</b><span class="muted">Active Deals</span></div><div class="stat"><b>'+money(pipeVal)+'</b><span class="muted">Pipeline Value</span></div><div class="stat"><b>'+money(wonVal)+'</b><span class="muted">Won Value</span></div>';document.getElementById('rows').innerHTML=leads.length?leads.map((x,i)=>'<tr><td><b>'+esc(x.company)+'</b></td><td>'+esc(x.event||'')+'</td><td>'+esc(x.status||'New')+'</td><td>'+esc(x.priority||'WARM')+'</td><td><input type="number" min="0" value="'+esc(x.dealValue||'')+'" placeholder="0" onchange="setValue('+i+',this.value)"></td></tr>').join(''):'<tr><td colspan="5" class="muted">No leads yet.</td></tr>'}function setValue(i,v){leads[i].dealValue=Number(v)||0;save();render()}function esc(v){return String(v??'').replace(/[&<>\"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[s]||s))}render();</script></body></html>
