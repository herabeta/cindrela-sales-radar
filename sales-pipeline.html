<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cindrela Sales Pipeline</title><style>body{font-family:Inter,Arial,sans-serif;margin:0;background:#f4f7fb;color:#172033}.header{background:#101828;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:5}.wrap{max-width:1300px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.dark{background:#101828;color:#fff}.blue{background:#2563eb;color:#fff}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.toolbar input,.toolbar select{padding:10px;border:1px solid #e4e7ec;border-radius:9px;background:#fff}.toolbar input{flex:1;min-width:230px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:12px 0 18px}.stat{background:#fff;border:1px solid #e4e7ec;border-radius:11px;padding:12px}.stat b{display:block;font-size:21px}.muted{color:#667085;font-size:11px}.board{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;align-items:start}.col{background:#eef2f6;border-radius:12px;padding:10px;min-height:280px}.col h3{font-size:13px;margin:3px 4px 10px}.lead{background:#fff;border:1px solid #e4e7ec;border-radius:10px;padding:12px;margin-bottom:9px;box-shadow:0 1px 3px #1018280a}.lead b{display:block;margin-bottom:4px}.lead .amount{font-weight:800;margin-top:7px}.lead select{width:100%;margin-top:9px;padding:8px;border:1px solid #e4e7ec;border-radius:7px}.follow{margin-top:8px;padding:8px;background:#f8fafc;border-radius:7px;font-size:11px}.overdue{color:#b42318;font-weight:800}.due{color:#b54708;font-weight:800}.empty{text-align:center;color:#98a2b3;font-size:11px;padding:25px 5px}.hint{background:#fff;border:1px solid #e4e7ec;border-radius:11px;padding:12px;margin:15px 0;font-size:12px}@media(max-width:1100px){.board{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.board{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:15px}}</style></head><body><header class="header"><b>CINDRELA SALES RADAR • SALES PIPELINE</b><span>🇳🇬 Abuja</span></header><main class="wrap"><div class="top"><div><h1>Sales Pipeline</h1><p class="muted">New → Contacted → Interested → Quoted → Won/Lost</p></div><button class="btn dark" onclick="location.href='/'">← Back to Sales Radar</button></div><div class="hint">Lead Finder and Pipeline use the same browser lead database. Move a lead here and its status is reflected in Lead Finder.</div><div class="toolbar"><input id="q" placeholder="Search company, event, role..."><select id="event"><option value="all">All opportunities</option></select><select id="priority"><option value="all">All priorities</option><option>HOT</option><option>WARM</option></select><select id="followFilter"><option value="all">All follow-ups</option><option value="overdue">Overdue</option><option value="today">Due today</option><option value="upcoming">Upcoming</option></select><button class="btn blue" onclick="addQuickLead()">＋ Quick Lead</button></div><div id="stats" class="stats"></div><div id="board" class="board"></div></main><script>const stages=['New','Contacted','Interested','Quoted','Won','Lost'];const KEY='cindrela_gitex_leads_v2';function seed(){return [{id:'demo1',company:'GITEX exhibitor lead',country:'Nigeria',role:'Business / Operations',stand:'',product:'Flight + Hotel + Airport Transfer',priority:'HOT',status:'New',contact:'Public business channel',source:'',msg:'',event:'GITEX Nigeria 2026',followUpDate:'',followUpAction:'Initial outreach'}]}function load(){let a=JSON.parse(localStorage.getItem(KEY)||'null');if(Array.isArray(a)&&a.length)return a.map(x=>({...x,event:x.event||'GITEX Nigeria 2026',followUpDate:x.followUpDate||'',followUpAction:x.followUpAction||''}));return seed()}let leads=load();function save(){localStorage.setItem(KEY,JSON.stringify(leads))}function esc(v){return String(v||'').replace(/[&<>"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]||s))}function stageOf(x){return stages.includes(x.status)?x.status:'New'}function followState(x){if(!x.followUpDate)return'none';const d=new Date(x.followUpDate+'T23:59:59');const now=new Date();now.setHours(0,0,0,0);if(d<now)return'overdue';if(x.followUpDate===new Date().toISOString().slice(0,10))return'today';return'upcoming'}function followHtml(x){if(!x.followUpDate)return'<div class="follow">📅 No follow-up set</div>';const st=followState(x);const cls=st==='overdue'?'overdue':st==='today'?'due':'';return'<div class="follow '+cls+'">📅 Follow-up: '+esc(x.followUpDate)+'<br>🎯 '+esc(x.followUpAction||'Follow up with lead')+'</div>'}function setFollowUp(id){const current=leads.find(x=>String(x.id)===String(id));if(!current)return;const date=prompt('Follow-up date (YYYY-MM-DD):',current.followUpDate||'');if(date===null)return;if(date&&!/^\d{4}-\d{2}-\d{2}$/.test(date)){alert('Use YYYY-MM-DD');return}const action=prompt('Next follow-up action:',current.followUpAction||'Send message / call / quote');leads=leads.map(x=>String(x.id)===String(id)?{...x,followUpDate:date,followUpAction:action||x.followUpAction}:x);save();render()}function render(){const q=document.getElementById('q').value.toLowerCase(),ev=document.getElementById('event').value,pr=document.getElementById('priority').value,ff=document.getElementById('followFilter').value;const events=[...new Set(leads.map(x=>x.event||'GITEX Nigeria 2026'))];document.getElementById('event').innerHTML='<option value="all">All opportunities</option>'+events.map(e=>'<option value="'+esc(e)+'">'+esc(e)+'</option>').join('');document.getElementById('event').value=ev==='all'?'all':events.includes(ev)?ev:'all';const a=leads.filter(x=>(ev==='all'||(x.event||'GITEX Nigeria 2026')===ev)&&(pr==='all'||x.priority===pr)&&(ff==='all'||followState(x)===ff)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));document.getElementById('stats').innerHTML=stages.map(s=>'<div class="stat"><b>'+a.filter(x=>stageOf(x)===s).length+'</b><span class="muted">'+s+'</span></div>').join('');document.getElementById('board').innerHTML=stages.map(s=>{const list=a.filter(x=>stageOf(x)===s);return'<section class="col"><h3>'+s+' <span class="muted">('+list.length+')</span></h3>'+(list.length?list.map(x=>'<article class="lead"><b>'+esc(x.company)+'</b><div class="muted">'+esc(x.event||'GITEX Nigeria 2026')+'</div><div class="muted">🎯 '+esc(x.role)+'</div><div class="muted">📞 '+esc(x.contact||'No public contact')+'</div><div class="muted">🔥 '+esc(x.priority||'WARM')+'</div><div class="amount">'+esc(x.product||'Travel package')+'</div>'+followHtml(x)+'<button class="btn blue" style="width:100%;margin-top:8px" onclick="setFollowUp(\''+String(x.id).replace(/'/g,"\\'")+'\')">📅 Set Follow-up</button><select onchange="move(\''+String(x.id).replace(/'/g,"\\'")+'\',this.value)">'+stages.map(z=>'<option '+(z===stageOf(x)?'selected':'')+'>'+z+'</option>').join('')+'</select></article>').join(''):'<div class="empty">No leads</div>')+'</section>'}).join('')}function move(id,status){leads=leads.map(x=>String(x.id)===String(id)?{...x,status}:x);save();render()}function addQuickLead(){const name=prompt('Company name');if(!name)return;const follow=prompt('Follow-up date (YYYY-MM-DD, optional):','');leads.push({id:Date.now(),company:name,country:'',role:'',stand:'',product:'Flight + Hotel + Transfer',priority:'HOT',status:'New',contact:'',source:'',msg:'',event:'GITEX Nigeria 2026',followUpDate:follow||'',followUpAction:follow?'Initial follow-up':''});save();render()}document.getElementById('q').addEventListener('input',render);document.getElementById('event').addEventListener('change',render);document.getElementById('priority').addEventListener('change',render);document.getElementById('followFilter').addEventListener('change',render);render();</script></body></html>
