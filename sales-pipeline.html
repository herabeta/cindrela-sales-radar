<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cindrela Sales Pipeline</title><style>body{font-family:Inter,Arial,sans-serif;margin:0;background:#f4f7fb;color:#172033}header{background:#101828;color:#fff;padding:16px 24px;position:sticky;top:0;z-index:3}.wrap{max-width:1250px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.dark{background:#101828;color:#fff}.blue{background:#2563eb;color:#fff}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.toolbar input,.toolbar select{padding:10px;border:1px solid #e4e7ec;border-radius:9px;background:#fff}.toolbar input{flex:1;min-width:230px}.board{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;align-items:start}.col{background:#eef2f6;border-radius:12px;padding:10px;min-height:260px}.col h3{font-size:13px;margin:3px 4px 10px}.lead{background:#fff;border:1px solid #e4e7ec;border-radius:10px;padding:12px;margin-bottom:9px}.lead b{display:block}.muted{color:#667085;font-size:11px}.lead select{width:100%;margin-top:9px;padding:8px;border:1px solid #e4e7ec;border-radius:7px}.empty{text-align:center;color:#98a2b3;font-size:11px;padding:25px 5px}@media(max-width:1050px){.board{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.board{grid-template-columns:1fr}.wrap{padding:15px}}</style></head><body><header><b>CINDRELA SALES RADAR • SALES PIPELINE</b></header><main class="wrap"><div class="top"><div><h1>Sales Pipeline</h1><p class="muted">New → Contacted → Interested → Quoted → Won/Lost</p></div><button class="btn dark" onclick="location.href='/'">← Back to Sales Radar</button></div><div class="toolbar"><input id="q" placeholder="Search company, event, role..."><select id="event"><option value="all">All opportunities</option><option>GITEX Nigeria 2026</option><option>Abuja International Trade Fair</option><option>International Cybersecurity Conference 2026</option><option>Digital Nigeria</option><option>Africa Space Economy Conference 2026</option></select><button class="btn blue" onclick="clearDemo()">Clear Demo Leads</button></div><div id="board" class="board"></div></main><script>const stages=['New','Contacted','Interested','Quoted','Won','Lost'];let leads=JSON.parse(localStorage.getItem('cindrelaPipeline')||'null')||[{id:1,company:'GITEX exhibitor lead',event:'GITEX Nigeria 2026',role:'Business / Operations',contact:'Public business channel',stage:'New'},{id:2,company:'Abuja Trade Fair prospect',event:'Abuja International Trade Fair',role:'Exhibitor / Procurement',contact:'Needs verification',stage:'New'}];function save(){localStorage.setItem('cindrelaPipeline',JSON.stringify(leads))}function render(){const q=document.getElementById('q').value.toLowerCase(),ev=document.getElementById('event').value;document.getElementById('board').innerHTML=stages.map(s=>{const a=leads.filter(x=>x.stage===s&&(ev==='all'||x.event===ev)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));return `<section class="col"><h3>${s} <span class="muted">(${a.length})</span></h3>${a.length?a.map(x=>`<article class="lead"><b>${x.company}</b><div class="muted">${x.event}</div><div class="muted">🎯 ${x.role}</div><div class="muted">📞 ${x.contact}</div><select onchange="move(${x.id},this.value)">${stages.map(z=>`<option ${z===x.stage?'selected':''}>${z}</option>`).join('')}</select></article>`).join(''):'<div class="empty">No leads</div>'}</section>`}).join('')}function move(id,stage){leads=leads.map(x=>x.id===id?{...x,stage}:x);save();render()}function clearDemo(){if(confirm('Clear local pipeline leads?')){leads=[];save();render()}}document.getElementById('q').addEventListener('input',render);document.getElementById('event').addEventListener('change',render);render();</script></body></html>
