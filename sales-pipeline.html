<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cindrela Sales Pipeline</title><style>body{font-family:Inter,Arial,sans-serif;margin:0;background:#f4f7fb;color:#172033}.header{background:#101828;color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:14px;position:sticky;top:0;z-index:50}.brand{display:flex;align-items:center;gap:12px}.nav{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.nav a{color:#dce8f5;text-decoration:none;padding:8px 10px;border-radius:7px;font-size:12px;font-weight:800}.nav a:hover,.nav a.active{background:#1688f7;color:#fff}.wrap{max-width:1300px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer;position:relative;z-index:2}.dark{background:#101828;color:#fff}.blue{background:#2563eb;color:#fff}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.toolbar input,.toolbar select{padding:10px;border:1px solid #e4e7ec;border-radius:9px;background:#fff}.toolbar input{flex:1;min-width:230px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:12px 0 18px}.stat{background:#fff;border:1px solid #e4e7ec;border-radius:11px;padding:12px}.stat b{display:block;font-size:21px}.muted{color:#667085;font-size:11px}.board{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;align-items:start}.col{background:#eef2f6;border-radius:12px;padding:10px;min-height:280px}.col h3{font-size:13px;margin:3px 4px 10px}.lead{background:#fff;border:1px solid #e4e7ec;border-radius:10px;padding:12px;margin-bottom:9px;position:relative}.lead b{display:block;margin-bottom:4px}.lead .amount{font-weight:800;margin-top:7px}.follow{margin-top:8px;padding:8px;background:#f8fafc;border-radius:7px;font-size:11px}.overdue{color:#b42318;font-weight:800}.due{color:#b54708;font-weight:800}.empty{text-align:center;color:#98a2b3;font-size:11px;padding:25px 5px}.hint{background:#fff;border:1px solid #e4e7ec;border-radius:11px;padding:12px;margin:15px 0;font-size:12px}.stage-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:9px}.stage-btn{border:1px solid #d9e2ec;background:#f8fafc;color:#334155;border-radius:7px;padding:7px 4px;font-size:10px;font-weight:800;cursor:pointer;position:relative;z-index:3}.stage-btn:hover{background:#eaf4ff;border-color:#1688f7}.stage-btn.current{background:#1688f7;border-color:#1688f7;color:#fff}.follow-btn{width:100%;margin-top:8px}.more{width:100%;margin-top:2px;border:1px dashed #b8c7d9;background:#fff;color:#2563eb;border-radius:8px;padding:8px;font-size:11px;font-weight:800;cursor:pointer}.searchPrompt{grid-column:1/-1;background:#fff;border:1px dashed #cbd5e1;border-radius:12px;padding:35px;text-align:center;color:#667085;font-size:13px}@media(max-width:1100px){.board{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(3,1fr)}.nav{display:none}}@media(max-width:650px){.board{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:15px}.header{padding:13px 15px}.stage-actions{grid-template-columns:repeat(2,1fr)}}button,a,input,select{pointer-events:auto!important}</style><link rel="stylesheet" href="/ui.css"></head><body><header class="header"><div class="brand"><b>CINDRELA SALES RADAR • SALES PIPELINE</b><span>🇳🇬 Abuja</span></div><nav class="nav"><a href="/">⌂ Dashboard</a><a href="/lead-finder.html">⌕ Lead Finder</a><a href="/event-calendar-full.html">▣ Events</a><a class="active" href="/sales-pipeline.html">♧ Pipeline</a><a href="/intelligence.html">◉ Daily Intelligence</a></nav></header><main class="wrap"><div class="top"><div><h1>Sales Pipeline</h1><p class="muted">Search a lead name to open its pipeline record.</p></div><button type="button" class="btn dark" id="backBtn">← Back to Sales Radar</button></div><div class="hint">Enter a lead/company name in Search. Pipeline records stay hidden until you search.</div><div class="toolbar"><input id="q" placeholder="Search lead/company name..."><select id="event"><option value="all">All opportunities</option></select><select id="priority"><option value="all">All priorities</option><option>HOT</option><option>WARM</option></select><select id="followFilter"><option value="all">All follow-ups</option><option value="overdue">Overdue</option><option value="today">Due today</option><option value="upcoming">Upcoming</option></select><button type="button" class="btn blue" id="quickBtn">＋ Quick Lead</button></div><div id="stats" class="stats"></div><div id="board" class="board"></div></main><script>const stages=['New','Contacted','Interested','Quoted','Won','Lost'];const KEY='cindrela_sales_leads_v3';const PAGE_SIZE=60;let leads=[];let visibleByStage={};let lastFilterKey='';function load(){try{const a=JSON.parse(localStorage.getItem(KEY)||'null');return Array.isArray(a)?a:[]}catch(e){return[]}}function save(){localStorage.setItem(KEY,JSON.stringify(leads))}function esc(v){return String(v??'').replace(/[&<>\"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[s]||s))}function stageOf(x){const s=x.status||x.stage;return stages.includes(s)?s:'New'}function followState(x){if(!x.followUpDate)return'none';const d=new Date(x.followUpDate+'T23:59:59'),now=new Date();now.setHours(0,0,0,0);if(d<now)return'overdue';if(x.followUpDate===new Date().toISOString().slice(0,10))return'today';return'upcoming'}function followHtml(x){if(!x.followUpDate)return'<div class="follow">📅 No follow-up set</div>';const st=followState(x),cls=st==='overdue'?'overdue':st==='today'?'due':'';return'<div class="follow '+cls+'">📅 Follow-up: '+esc(x.followUpDate)+'<br>🎯 '+esc(x.followUpAction||'Follow up with lead')+'</div>'}function updateEvents(){const sel=document.getElementById('event'),old=sel.value,seen=new Set(),events=[];for(const x of leads){const e=x.event||'GITEX Nigeria 2026';if(!seen.has(e)){seen.add(e);events.push(e)}}sel.innerHTML='<option value="all">All opportunities</option>'+events.map(e=>'<option value="'+esc(e)+'">'+esc(e)+'</option>').join('');sel.value=old==='all'||seen.has(old)?old:'all'}function matches(x,q,ev,pr,ff){if(ev!=='all'&&(x.event||'GITEX Nigeria 2026')!==ev)return false;if(pr!=='all'&&x.priority!==pr)return false;if(ff!=='all'&&followState(x)!==ff)return false;if(!q)return true;const text=((x.company||'')+' '+(x.event||'')+' '+(x.role||'')+' '+(x.contact||'')+' '+(x.product||'')+' '+(x.priority||'')).toLowerCase();return text.includes(q)}function render(){const q=document.getElementById('q').value.trim().toLowerCase(),ev=document.getElementById('event').value,pr=document.getElementById('priority').value,ff=document.getElementById('followFilter').value;const key=q+'|'+ev+'|'+pr+'|'+ff;if(key!==lastFilterKey){visibleByStage={};lastFilterKey=key}if(!q){document.getElementById('stats').innerHTML='';document.getElementById('board').innerHTML='<div class="searchPrompt">🔎 Search a lead/company name above to open its pipeline record.</div>';return}const groups={New:[],Contacted:[],Interested:[],Quoted:[],Won:[],Lost:[]};for(const x of leads){if(matches(x,q,ev,pr,ff))groups[stageOf(x)].push(x)}document.getElementById('stats').innerHTML=stages.map(s=>'<div class="stat"><b>'+groups[s].length+'</b><span class="muted">'+s+'</span></div>').join('');document.getElementById('board').innerHTML=stages.map(s=>{const list=groups[s],shown=visibleByStage[s]||PAGE_SIZE;const html=list.length?list.slice(0,shown).map(x=>'<article class="lead"><b>'+esc(x.company)+'</b><div class="muted">'+esc(x.event||'')+'</div><div class="muted">🎯 '+esc(x.role)+'</div><div class="muted">📞 '+esc(x.contact||'No public contact')+'</div><div class="muted">🔥 '+esc(x.priority||'WARM')+'</div><div class="amount">'+esc(x.product||'Travel package')+'</div>'+followHtml(x)+'<button type="button" class="btn blue follow-btn" data-action="follow" data-id="'+esc(x.id)+'">📅 Set Follow-up</button><div class="stage-actions">'+stages.map(z=>'<button type="button" class="stage-btn '+(z===stageOf(x)?'current':'')+'" data-action="stage" data-id="'+esc(x.id)+'" data-stage="'+z+'">'+z+'</button>').join('')+'</div></article>').join(''):'<div class="empty">No leads</div>';const more=list.length>shown?'<button type="button" class="more" data-action="more" data-stage="'+s+'">Show more ('+(list.length-shown)+' remaining)</button>':'';return'<section class="col"><h3>'+s+' <span class="muted">('+list.length+')</span></h3>'+html+more+'</section>'}).join('')}function setFollowUp(id){const current=leads.find(x=>String(x.id)===String(id));if(!current)return;const date=prompt('Follow-up date (YYYY-MM-DD):',current.followUpDate||'');if(date===null)return;if(date&&!/^\d{4}-\d{2}-\d{2}$/.test(date)){alert('Use YYYY-MM-DD');return}const action=prompt('Next follow-up action:',current.followUpAction||'Send message / call / quote');leads=leads.map(x=>String(x.id)===String(id)?{...x,followUpDate:date,followUpAction:action||x.followUpAction}:x);save();render()}function move(id,status){let changed=false;leads=leads.map(x=>{if(String(x.id)!==String(id))return x;changed=true;return{...x,status:status,stage:status}});if(changed){save();render()}}function addQuickLead(){const name=prompt('Company name');if(!name)return;leads.push({id:Date.now(),company:name,country:'',role:'',stand:'',product:'Flight + Hotel + Transfer',priority:'HOT',status:'New',stage:'New',contact:'',source:'',msg:'',event:'GITEX Nigeria 2026',followUpDate:'',followUpAction:''});save();updateEvents();document.getElementById('q').value=name;render()}document.getElementById('backBtn').addEventListener('click',()=>location.href='/');document.getElementById('quickBtn').addEventListener('click',addQuickLead);document.getElementById('q').addEventListener('input',render);document.getElementById('event').addEventListener('change',render);document.getElementById('priority').addEventListener('change',render);document.getElementById('followFilter').addEventListener('change',render);document.getElementById('board').addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;e.preventDefault();if(el.dataset.action==='more'){visibleByStage[el.dataset.stage]=(visibleByStage[el.dataset.stage]||PAGE_SIZE)+PAGE_SIZE;render();return}const id=el.dataset.id;if(el.dataset.action==='stage')move(id,el.dataset.stage);if(el.dataset.action==='follow')setFollowUp(id)});leads=load();requestAnimationFrame(()=>{updateEvents();render()});</script></body></html>
