<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cindrela Event Explorer — Full Calendar</title><style>:root{--n:#101828;--bg:#f4f7fb;--line:#e4e7ec;--mut:#667085;--blue:#2563eb;--red:#e5484d;--orange:#f79009}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:#172033}.header{background:var(--n);color:#fff;padding:14px 28px;font-weight:900;font-size:20px;display:flex;justify-content:space-between}.back{background:#fff;color:var(--n);padding:9px 12px;border-radius:9px;text-decoration:none;font-size:12px;font-weight:900}.wrap{max-width:1400px;margin:auto;padding:22px}.hero,.toolbar,.summary{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}.hero h1{margin:0 0 5px}.hero p{margin:0;color:var(--mut)}.toolbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.toolbar select,.toolbar input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:700}.summary{display:flex;gap:10px;flex-wrap:wrap}.pill{padding:8px 11px;border:1px solid var(--line);border-radius:9px;font-size:12px;font-weight:800}.filter-btn{cursor:pointer;background:#fff;font-family:inherit}.filter-btn:hover,.filter-btn.active{border-color:var(--blue);color:var(--blue);background:#eef4ff}.month-title{font-size:21px;margin:26px 0 12px;padding-bottom:7px;border-bottom:2px solid var(--line)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-left:5px solid var(--orange);border-radius:13px;padding:15px}.card.red{border-left-color:var(--red);box-shadow:0 2px 10px rgba(229,72,77,.12)}.top{display:flex;justify-content:space-between;gap:7px}.badge,.redbadge,.score{font-size:10px;font-weight:900;padding:5px 8px;border-radius:20px}.badge{background:#f2f4f7}.redbadge{background:#fff1f3;color:#c01048}.score{color:#175cd3;background:#eef4ff}.card h3{margin:10px 0 7px;font-size:17px}.meta{font-size:12.5px;color:var(--mut);line-height:1.65}.box{margin-top:9px;background:#f8fafc;border-radius:9px;padding:10px;font-size:12px}.box b{display:block;margin-bottom:4px}.source{display:inline-block;margin-top:10px;color:var(--blue);font-size:12px;font-weight:800;text-decoration:none}.empty{background:#fff;border:1px solid var(--line);border-radius:13px;padding:22px;color:var(--mut)}@media(max-width:900px){.toolbar{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr 1fr}}@media(max-width:600px){.toolbar{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.wrap{padding:12px}.header{padding:12px 14px;font-size:16px}}</style></head><body><header class="header"><span>CINDRELA SALES RADAR • EVENT EXPLORER</span><a class="back" href="/">← Back to Sales Radar</a></header><main class="wrap"><section class="hero"><h1>🌍 Full Upcoming Event Explorer</h1><p>Live from the Sales Radar opportunity database. Events are shown in chronological order by start date.</p></section><div class="toolbar"><select id="country"><option value="all">All countries</option></select><select id="city"><option value="all">All cities</option></select><select id="month"><option value="all">All upcoming months</option></select><input id="q" placeholder="Search event / category / target..."></div><div class="summary"><span class="pill" id="count">Loading events…</span><button class="pill filter-btn active" data-filter="all">🎪 All</button><button class="pill filter-btn" data-filter="exhibitions">🎪 Exhibitions</button><button class="pill filter-btn" data-filter="business">💼 Business</button><button class="pill filter-btn" data-filter="sports">⚽ Sports / FIFA</button><button class="pill filter-btn" data-filter="seasonal">🎵 Festivals</button><button class="pill filter-btn" data-filter="international">🌍 International</button><button class="pill filter-btn" data-filter="high">🔴✈️ High Travel</button></div><section id="cards"></section></main><script>
const country=document.getElementById('country'),city=document.getElementById('city'),month=document.getElementById('month'),q=document.getElementById('q'),cards=document.getElementById('cards'),count=document.getElementById('count');
let events=[],plays={},activeFilter='all';
const esc=s=>String(s??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const monthKey=e=>String(e.start_date||'').slice(0,7);const dateLabel=(s,e)=>{const d=new Date((s||'')+'T00:00:00'),x=new Date((e||s||'')+'T00:00:00');if(isNaN(d))return s||'';if(!e||isNaN(x)||d.getTime()===x.getTime())return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});const a=d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}),b=x.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});return d.getFullYear()===x.getFullYear()&&d.getMonth()===x.getMonth()?a+' – '+b:d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' – '+b};const dateLabel=(s,e)=>{const d=new Date((s||'')+'T00:00:00'),x=new Date((e||s||'')+'T00:00:00');if(isNaN(d))return s||'';if(!e||isNaN(x)||d.getTime()===x.getTime())return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});const a=d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}),b=x.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});return d.getFullYear()===x.getFullYear()&&d.getMonth()===x.getMonth()?a+' – '+b:d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' – '+b};
const dateLabel=(s,e)=>{const d=new Date((s||'')+'T00:00:00'),x=new Date((e||s||'')+'T00:00:00');if(isNaN(d))return s||'';if(!e||isNaN(x)||d.getTime()===x.getTime())return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});const a=d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}),b=x.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});return d.getFullYear()===x.getFullYear()&&d.getMonth()===x.getMonth()?a+' – '+b:d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' – '+b};
const monthLabel=k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m-1,1).toLocaleString('en',{month:'long',year:'numeric'})};
const scoreFor=e=>{let s=e.group==='sports'?94:e.group==='seasonal'?88:84;if(e.sales_market==='Nigeria')s+=5;if(/FIFA|Olympic|World Cup|Grand Prix|AFCON|Super Bowl|Australian Open|MWC|CES|Web Summit/i.test(e.title))s+=3;return Math.min(100,s)};
function matchesFilter(e){const s=scoreFor(e);if(activeFilter==='high')return s>=94;if(activeFilter==='international')return String(e.country||'').toLowerCase()!=='nigeria';if(activeFilter==='sports')return e.group==='sports'||/FIFA|Olympic|World Cup|Grand Prix|AFCON|Super Bowl|Australian Open/i.test(e.title);if(activeFilter==='seasonal')return e.group==='seasonal';if(activeFilter==='business')return e.group==='business';if(activeFilter==='exhibitions')return /exhibition|expo|trade fair|fair|market/i.test(`${e.title} ${e.group}`);return true}
function setupFilters(){[...new Set(events.map(e=>e.country||'Unknown'))].sort().forEach(v=>country.insertAdjacentHTML('beforeend',`<option value="${esc(v)}">${esc(v)}</option>`));[...new Set(events.map(e=>(e.city||'Unknown').replace(/,\s*Nigeria$/,'')))].sort().forEach(v=>city.insertAdjacentHTML('beforeend',`<option value="${esc(v)}">${esc(v)}</option>`));[...new Set(events.map(monthKey).filter(Boolean))].sort().forEach(v=>month.insertAdjacentHTML('beforeend',`<option value="${esc(v)}">${esc(monthLabel(v))}</option>`))}
function render(){const C=country.value,CI=city.value,M=month.value,S=q.value.trim().toLowerCase();const filtered=events.filter(e=>{const c=e.country||'',ci=(e.city||'').replace(/,\s*Nigeria$/,'');const text=`${e.title} ${e.group} ${c} ${e.city} ${JSON.stringify(plays[e.id]||'')}`.toLowerCase();return(C==='all'||c===C)&&(CI==='all'||ci===CI)&&(M==='all'||monthKey(e)===M)&&(!S||text.includes(S))&&matchesFilter(e)}).sort((a,b)=>String(a.start_date).localeCompare(String(b.start_date))||String(a.title).localeCompare(String(b.title)));count.textContent=`${filtered.length} events`;if(!filtered.length){cards.innerHTML='<div class="empty">No events match these filters.</div>';return}const groups=[...new Set(filtered.map(monthKey))].sort();cards.innerHTML=groups.map(k=>{const items=filtered.filter(e=>monthKey(e)===k);return `<section><h2 class="month-title">📅 ${esc(monthLabel(k))}</h2><div class="cards">${items.map(e=>{const p=plays[e.id]||[];const target=p[0]||((e.group==='sports')?'Fans, supporters, sports groups, delegations':'Exhibitors, delegates, buyers, corporate teams');const sell=p[1]||((e.group==='sports')?'Flights + Hotels + Transfers + Group Travel':'Flights + Hotels + Transfers + Business Travel');const s=scoreFor(e),high=s>=94;return `<article class="card ${high?'red':''}"><div class="top"><span class="${high?'redbadge':'badge'}">${high?'🔴✈️ HIGH TRAVEL':esc((e.group||'event').replace(/^./,x=>x.toUpperCase()))}</span><span class="score">Score ${s}</span></div><h3>${esc(e.title)}</h3><div class="meta"><b>📅 ${esc(dateLabel(e.start_date,e.end_date))}</b><br>📍 ${esc(e.city||'')}</div><div class="box"><b>🎯 Target</b>${esc(target)}</div><div class="box"><b>💰 Cindrela opportunity</b>${esc(sell)}</div>${e.url?`<a class="source" href="${esc(e.url)}" target="_blank" rel="noopener">Source / event info →</a>`:''}</article>`}).join('')}</div></section>`}).join('')}
async function load(){try{count.textContent='Loading events…';const a=await fetch('/data/opportunities.json?ts='+Date.now(),{cache:'no-store'});if(!a.ok)throw Error('opportunities unavailable');events=await a.json();try{const b=await fetch('/data/event-sales-plays.json?ts='+Date.now(),{cache:'no-store'});plays=b.ok?await b.json():{}}catch(_){plays={}}setupFilters();render()}catch(err){count.textContent='Unable to load events';cards.innerHTML='<div class="empty">Event data could not be loaded. Please refresh.</div>';console.error(err)}}
[country,city,month,q].forEach(x=>x.addEventListener(x.tagName==='INPUT'?'input':'change',render));document.querySelectorAll('.filter-btn').forEach(btn=>btn.addEventListener('click',()=>{activeFilter=btn.dataset.filter;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b===btn));render()}));load();
</script></body></html>
