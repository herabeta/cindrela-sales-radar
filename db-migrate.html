<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cindrela Sales Radar — Database Migration</title>
<style>body{font-family:Arial,sans-serif;background:#07111f;color:#e8eef7;min-height:100vh;display:grid;place-items:center;margin:0}.card{width:min(560px,calc(100% - 32px));background:#101c2d;border:1px solid #26364d;border-radius:18px;padding:28px;box-sizing:border-box}h1{margin:0 0 10px}p{color:#9fb0c5;line-height:1.5}input{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;border:1px solid #33465f;background:#081321;color:#fff;margin:12px 0}button{width:100%;padding:14px;border:0;border-radius:10px;background:#2878ff;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}pre{white-space:pre-wrap;background:#081321;padding:14px;border-radius:10px;margin-top:16px;color:#b9f6cf}</style>
</head>
<body><main class="card"><h1>Database Migration</h1><p>This securely runs the existing JSON → Neon migration. Your JSON files are not deleted.</p><input id="secret" type="password" placeholder="Enter MIGRATION_SECRET" autocomplete="off"><button id="run">Run Migration</button><pre id="out" hidden></pre></main>
<script>
const btn=document.getElementById('run'), input=document.getElementById('secret'), out=document.getElementById('out');
btn.onclick=async()=>{const secret=input.value.trim();if(!secret){out.hidden=false;out.textContent='Please enter the migration secret.';return}btn.disabled=true;out.hidden=false;out.textContent='Running migration…';try{const r=await fetch('/api/db-migrate',{method:'POST',headers:{'x-migration-secret':secret}});const data=await r.json();out.textContent=JSON.stringify(data,null,2)}catch(e){out.textContent='Migration request failed: '+e.message}finally{btn.disabled=false}};
</script></body></html>
