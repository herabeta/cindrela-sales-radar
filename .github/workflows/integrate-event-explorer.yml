name: Integrate Event Explorer into main site

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.event.head_commit.message != 'Integrate Event Explorer into main site' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Event Explorer navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<button onclick="location.href=\'/sales-pipeline.html\'">📈 Sales Pipeline</button>'
          new = old + '<button onclick="location.href=\'/event-calendar.html\'">🗓️ Event Explorer</button>'
          if 'location.href=\'/event-calendar.html\'' not in s and old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Integrate Event Explorer into main site'
          git push
