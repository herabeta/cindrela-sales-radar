name: Lock Sales Radar navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-nav:
    if: ${{ github.event.head_commit.message != 'Lock Sales Radar navigation' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Persist Lead Finder and Back navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_css = '.nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 20px}'
          new_css = '.nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 20px;position:sticky;top:57px;z-index:25;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}.header-actions{display:flex;align-items:center;gap:10px}.header-lead{border:0;background:#fff;color:var(--n);padding:9px 12px;border-radius:9px;font-weight:800;cursor:pointer}'
          if old_css in s and 'position:sticky;top:57px' not in s:
              s = s.replace(old_css, new_css, 1)

          old_header = '<header><div class="logo">CINDRELA SALES RADAR</div><div class="location">🇳🇬 Abuja, Nigeria</div></header>'
          new_header = '<header><div class="logo">CINDRELA SALES RADAR</div><div class="header-actions"><button class="header-lead" onclick="document.querySelector(\'.nav button[data-view=\\\"leads\\\"]\').click()">🎯 Lead Finder</button><div class="location">🇳🇬 Abuja, Nigeria</div></div></header>'
          if old_header in s and 'class="header-lead"' not in s:
              s = s.replace(old_header, new_header, 1)

          marker = '<section id="leads" class="view"><div class="hero">'
          back = '<section id="leads" class="view"><button class="close" style="margin-bottom:12px" onclick="document.querySelector(\'.nav button[data-view=\\\"opportunities\\\"]\').click()">← Back to Sales Opportunities</button><div class="hero">'
          if marker in s and 'Back to Sales Opportunities' not in s:
              s = s.replace(marker, back, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit locked navigation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Lock Sales Radar navigation'
          git push
