name: Daily Lead Enrichment V2
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/expand_event_leads.py'
      - 'scripts/enrich_public_company_leads.py'
      - 'scripts/clean_public_leads.py'
      - 'scripts/harden_lead_finder.py'
      - 'scripts/group_lead_finder_display.py'
      - 'scripts/add_nigeria_filter.py'
      - 'scripts/split_public_leads.py'
      - 'scripts/patch_date_range_display.py'
      - 'scripts/validate_sales_radar_data.py'
      - 'data/opportunities.json'
      - 'data/public-lead-contacts.json'
      - 'index.html'
      - 'event-calendar-full.html'
      - 'lead-finder.html'
permissions:
  contents: write
jobs:
  enrich:
    if: github.actor != 'cindrela-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Expand every event into contactable leads
        run: python scripts/expand_event_leads.py
      - name: Expand event-linked companies into contactable public leads
        run: python scripts/enrich_public_company_leads.py
      - name: Remove malformed and placeholder public contact values
        run: python scripts/clean_public_leads.py
      - name: Harden Lead Finder contact deduplication
        run: python scripts/harden_lead_finder.py
      - name: Group Lead Finder cards by company safely
        run: python scripts/group_lead_finder_display.py
      - name: Add Nigeria-only Sales Opportunities filter safely
        run: python scripts/add_nigeria_filter.py
      - name: Split leads into fast event-wise files
        run: python scripts/split_public_leads.py
      - name: Apply verified event date ranges to user-facing cards
        run: python scripts/patch_date_range_display.py
      - name: Validate Sales Radar data
        run: python scripts/validate_sales_radar_data.py
      - name: Validate Event Explorer JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('event-calendar-full.html')
          s = p.read_text(encoding='utf-8')
          count = len(re.findall(r'\b(?:const|let|var)\s+dateLabel\s*=', s))
          if count != 1:
              raise SystemExit(f'Event Explorer dateLabel declaration count is {count}; expected exactly 1')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, re.I | re.S)
          if not scripts:
              raise SystemExit('Event Explorer has no script block')
          Path('/tmp/event-explorer.js').write_text('\n'.join(scripts), encoding='utf-8')
          print('Event Explorer JS structure check passed.')
          PY
          node --check /tmp/event-explorer.js
      - name: Validate Lead Finder JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('lead-finder.html')
          s = p.read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, re.I | re.S)
          if not scripts:
              raise SystemExit('Lead Finder has no script block')
          Path('/tmp/lead-finder.js').write_text('\n'.join(scripts), encoding='utf-8')
          if 'contactKey=' not in s:
              raise SystemExit('Lead Finder multiple-contact hardening is missing')
          harden = Path('scripts/harden_lead_finder.py').read_text(encoding='utf-8')
          if 'badEmail=' not in harden or 'email@domain.ext' not in harden or 'png|jpe?g' not in harden:
              raise SystemExit('Lead Finder malformed-email guard implementation is missing')
          if 'Companies' not in s:
              raise SystemExit('Lead Finder company-group display patch is missing')
          print('Lead Finder JS structure, contact validation implementation and company grouping checks passed.')
          PY
          node --check /tmp/lead-finder.js
      - name: Validate Sales Opportunities JavaScript and Nigeria filter
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if s.count('data-filter="nigeria"') != 1:
              raise SystemExit('Sales Opportunities Nigeria filter is missing or duplicated')
          if s.count('function isNigeriaOpportunity(o)') != 1:
              raise SystemExit('Sales Opportunities Nigeria helper is missing or duplicated')
          if s.count("current==='nigeria'&&isNigeriaOpportunity(o)") != 1:
              raise SystemExit('Sales Opportunities Nigeria filter logic is missing or duplicated')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, re.I | re.S)
          if not scripts:
              raise SystemExit('Sales Opportunities has no script block')
          Path('/tmp/sales-opportunities.js').write_text('\n'.join(scripts), encoding='utf-8')
          print('Sales Opportunities Nigeria filter and JS structure check passed.')
          PY
          node --check /tmp/sales-opportunities.js
      - name: Commit enriched leads and safe Sales Radar changes
        run: |
          git config user.name 'cindrela-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/public-lead-contacts.json data/public-lead-index.json data/leads-by-event data/opportunities.json index.html event-calendar-full.html lead-finder.html scripts/enrich_public_company_leads.py scripts/clean_public_leads.py scripts/harden_lead_finder.py scripts/group_lead_finder_display.py scripts/add_nigeria_filter.py
          git diff --cached --quiet || git commit -m 'Clean and strengthen Lead Finder public contacts'
          git push
