name: Daily Cindrela Intelligence
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_daily_intelligence.py'
      - 'scripts/build_sales_alerts.py'
      - 'scripts/fix_months_and_2027.py'
      - 'data/opportunities.json'
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'cindrela-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Repair month timeline and future opportunities
        run: python scripts/fix_months_and_2027.py
      - name: Refresh worldwide intelligence feed
        run: python scripts/update_daily_intelligence.py
      - name: Build early sales alerts
        run: python scripts/build_sales_alerts.py
      - name: Commit updated intelligence, alerts, event data and UI
        run: |
          git config user.name 'cindrela-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/daily-intelligence.json data/sales-alerts.json data/opportunities.json data/event-sales-plays.json index.html
          git diff --cached --quiet || git commit -m 'Daily refresh and monthly event timeline repair'
          git push
