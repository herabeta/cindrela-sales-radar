name: Daily Cindrela Intelligence
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Refresh intelligence feed
        run: python scripts/update_daily_intelligence.py
      - name: Build early sales alerts
        run: python scripts/build_sales_alerts.py
      - name: Commit updated intelligence and alerts
        run: |
          git config user.name 'cindrela-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/daily-intelligence.json data/sales-alerts.json
          git diff --cached --quiet || git commit -m 'Daily refresh of intelligence and sales alerts'
          git push
